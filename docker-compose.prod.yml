services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_arbitr}
      POSTGRES_USER: ${POSTGRES_USER:-ai_arbitr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - ./deploy/config.js:/usr/share/nginx/html/config.js:ro
      - ../ai-arbitr-assets/fonts:/usr/share/nginx/html/fonts:ro
    depends_on:
      - backend

  nginx:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
