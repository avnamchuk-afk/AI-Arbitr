services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_arbitr}
      POSTGRES_USER: ${POSTGRES_USER:-ai_arbitr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - ./deploy/config.js:/usr/share/nginx/html/config.js:ro
      - ../ai-arbitr-assets/fonts:/usr/share/nginx/html/fonts:ro
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
